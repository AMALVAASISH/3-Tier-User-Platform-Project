name: Enterprise cicd pipeline
on: 
  push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflows/qa-cicd.yaml

jobs:
  gitleaks-scan:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v6

      - name: run gitleaks scan
        run: |
          docker run --rm \
          -v "${{github.workspace}}:/repo" \
          zricethezav/gitleaks:latest detect \
          --source=/repo \
          --report-format=json \
          --report-path=/repo/gitleaks-report.json \
          --redact \
          --exit-code 0

      - name: Upload gitleaks report
        uses : actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
  checkov-terraform:
    name: checkov terraform scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install checkov
        run: pip install checkov
      - name: run checkov terraform scan
        run: |
          checkov -d . \
            --framework terraform \
            -- output json > checkov-terraform-report.json || true
      - name: upload checkov terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn
          
  checkov-k8s:
    name: checkov kubernetes scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install checkov
        run: pip install checkov
      - name: run checkov kubernetes scan
        run: |
          checkov -d . \
            --framework kubernetes \
            -- output json > checkov-k8s-report.json || true
      - name: upload checkov kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn
          
  checkov-dockerfile:
    name: checkov dockerfile scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install checkov
        run: pip install checkov
      - name: run checkov docker scan
        run: |
          checkov -d . \
            --framework dockerfile \
            -- output json > checkov-dockerfile-report.json || true
      - name: upload checkov dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn  

  client-trivy-fs:
    name: client trivy fs scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
    - name: checkout source code
      uses: actions/checkout@v4

    - name: install trivy
      uses: aquasecurity/setup-trivy@v0.2.6
      with:
        version: latest
        cache: true

    - name: verify trivy installation
      run: |
        trivy --version
        which trivy

    - name: Run Trivy FS scan on client
      run: |
        trivy fs ./client \
          --format json \
          --output client-trivy-fs-report.json \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0

    - name: Run Trivy FS scan on client (TABLE)
      run: |
        trivy fs ./client \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0 > client-trivy-fs-report.txt

    - name: Upload client trivy json report
      uses: actions/upload-artifact@v4
      with:
        name: client-trivy-fs-json-report
        path: client-trivy-fs-report.json
        if-no-files-found: warn

    - name: upload client truvy table report
      uses: actions/upload-artifact@v4
      with:
        name: client-trivy-fs-report
        path: client-trivy-fs-report.txt
        if-no-files-found: warn
        
  server-trivy-fs:
    name: server trivy fs scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
    - name: checkout source code
      uses: actions/checkout@v4

    - name: install trivy
      uses: aquasecurity/setup-trivy@v0.2.6
      with:
        version: latest
        cache: true

    - name: verify trivy installation
      run: |
        trivy --version
        which trivy

    - name: Run Trivy FS scan on server
      run: |
        trivy fs ./server \
          --format json \
          --output server-trivy-fs-report.json \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0

    - name: Run Trivy FS scan on server (TABLE)
      run: |
        trivy fs ./server \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0 > server-trivy-fs-report.txt

    - name: Upload server trivy json report
      uses: actions/upload-artifact@v4
      with:
        name: server-trivy-fs-json-report
        path: server-trivy-fs-report.json
        if-no-files-found: warn

    - name: upload server trivy table report
      uses: actions/upload-artifact@v4
      with:
        name: server-trivy-fs-report
        path: server-trivy-fs-report.txt
        if-no-files-found: warn

  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest
    needs:
      - client-trivy-fs
      - checkov-dockerfile
      - checkov-k8s
      - checkov-terraform

    defaults:
      run:
        working-directory: client

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package.json

      - name: install client dependencies
        run: npm ci

      - name: Run client lint
        run: npm run lint --if-present
        continue-on-error: true
        
  server-lint:
    name: Server Lint
    runs-on: ubuntu-latest
    needs:
      - server-trivy-fs
      - checkov-dockerfile
      - checkov-k8s
      - checkov-terraform

    defaults:
      run:
        working-directory: server

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package.json

      - name: install server dependencies
        run: npm ci

      - name: Run server lint
        run: npm run lint --if-present
        continue-on-error: true

  client-test:
    name: Client Test
    runs-on: ubuntu-latest
    needs: client-lint

    defaults:
      run:
        working-directory: client

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup nodejs 
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package.json

      - name: Install client dependencies
        run: npm ci

      - name: Run client tests
        run: npm test --if-present
        continue-on-error: true

  server-test:
    name: Server Test
    runs-on: ubuntu-latest
    needs: server-lint

    defaults:
      run:
        working-directory: server

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: setup nodejs 
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test --if-present
        continue-on-error: true
        

        
      

      
          
    

























          
          
